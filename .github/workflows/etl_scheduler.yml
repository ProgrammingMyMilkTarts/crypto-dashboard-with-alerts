# GitHub Actions workflow to run the crypto ETL tasks on a schedule.
# This runs every 15 minutes and can also be triggered manually from the GitHub UI.

name: Crypto ETL and Price Checker

on:
  schedule:
    # Runs every 15 minutes in UTC.
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    # These environment variables match what the backend code is reading in core/database.py
    # and in the notification utilities. If these secrets are not added in GitHub, the job will fail.
  

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        # Use the scheduler-specific requirements file so the ETL job does not pull in
        # Streamlit or other app dependencies that can conflict in CI.
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt python-dotenv

      - name: Create .env file from repository
        run: |
          cp backend/.env .env || true


      - name: Run Crypto Fetcher (ETL)
        # Running from backend/src makes the module imports cleaner for etl.crypto_fetcher.
        working-directory: backend/src
        run: |
          python -m backend.src.etl.crypto_fetcher

      - name: Run Price Checker & Notifier
        # This job reads the same DB and notification secrets used by the app itself.
        working-directory: backend/src
        run: |
          python -m backend.src.etl.price_checker
